name: Cross-language compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci

      - name: Build codegen
        run: npm run build

      - name: Read schemata version
        run: echo "SCHEMATA_VERSION=$(cat .schemata-version | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Download schemata schemas
        run: |
          gh release download "$SCHEMATA_VERSION" -R nostrability/schemata -p '*.zip' -D /tmp
          mkdir -p /tmp/schemata-dist
          unzip -q /tmp/schemata-*.zip -d /tmp/schemata-dist
          echo "SCHEMAS_DIR=/tmp/schemata-dist" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Install additional compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ php-cli ruby
          # Try to install kotlinc (snap can be flaky)
          if ! command -v kotlinc >/dev/null 2>&1; then
            sudo snap install kotlin --classic 2>/dev/null || true
          fi

      - name: Run compile checks
        run: ./scripts/compile-check.sh --schemas "$SCHEMAS_DIR"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
